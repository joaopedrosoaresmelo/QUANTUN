const $=id=>document.getElementById(id),KEY='quantum_v1';
const def=()=>({k:0,e:100,i:100,w:1,done:{},perf:{},inv:[],own:['c1'],eq:'c1',cdx:{},cards:{},ach:{},used:{},sims:{},hint:0,errs:0,mus:.4,sfx:.7,t:0});
let S=def(),cur='title',AC,dg,NB,LT='dil',TH=1;
const ld=()=>{try{const r=localStorage.getItem(KEY);return r?Object.assign(def(),JSON.parse(r)):null}catch(e){return null}};
const sv=()=>{if(!S.started)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* ===== ÁUDIO ===== */
function au(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();dg=AC.createGain();dg.connect(AC.destination);vol();ensureFX();startMusic()}catch(e){}}
const vol=()=>{if(dg)dg.gain.value=S.mus*.45};
function sfx(f,d=.15,t='sine'){if(!AC||S.sfx<.01)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(S.sfx*.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
function noiseBuf(){if(NB||!AC)return NB;NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.12),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*.15));return NB}
/* passo: ruído filtrado curto; metal no Mundo 1 e piso macio no Mundo 2 */
function step(){if(!AC||S.sfx<.01)return;const b=noiseBuf();if(!b)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=TH==2?520:1500;f.Q.value=TH==2?1.2:2.5;g.gain.value=S.sfx*(TH==2?.18:.22);s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(AC.currentTime+.12)}
/* efeitos: reverb compartilhado (convolução com ruído decaindo) */
let REV,RG,MT=0,MI=0,MTimer=null;
function ensureFX(){if(REV||!AC)return;REV=AC.createConvolver();const n=Math.floor(AC.sampleRate*1.6),b=AC.createBuffer(2,n,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}REV.buffer=b;RG=AC.createGain();RG.gain.value=.6;REV.connect(RG);RG.connect(AC.destination)}
/* passos abafados: ruído passa-baixa + reverb + um baque grave */
function stepFX(){if(!AC||S.sfx<.01)return;ensureFX();const b=noiseBuf();if(!b)return;const s=AC.createBufferSource(),lp=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;s.playbackRate.value=.8+Math.random()*.2;lp.type='lowpass';lp.frequency.value=TH==2?360:480;lp.Q.value=.7;g.gain.value=S.sfx*.16;s.connect(lp);lp.connect(g);g.connect(AC.destination);g.connect(REV);s.start();s.stop(AC.currentTime+.15);const o=AC.createOscillator(),og=AC.createGain(),n=AC.currentTime;o.frequency.value=TH==2?90:120;og.gain.setValueAtTime(S.sfx*.12,n);og.gain.exponentialRampToValueAtTime(.001,n+.09);o.connect(og);og.connect(AC.destination);o.start(n);o.stop(n+.1)}
/* música de fundo procedural: pads suaves e arpejos com reverb; progressão muda por mundo */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG={1:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],2:[[50,53,57],[46,50,53],[48,52,55],[57,61,64]]};
function note(m,t,dur,type,vol,cut){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=type;o.frequency.value=mtof(m);lp.type='lowpass';lp.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.5,dur*.3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(dg);g.connect(REV);o.start(t);o.stop(t+dur+.05)}
function musicTick(){if(!AC||!dg)return;const now=AC.currentTime;if(MT<now)MT=now+.05;while(MT<now+.5){const ch=PROG[TH==2?2:1][Math.floor(MI/8)%4];const s=MI%8;if(s==0)ch.forEach(m=>note(m-12,MT,2.4,'sawtooth',.035,700));if(s%2==0&&Math.random()<.6){const m=ch[Math.floor(Math.random()*3)]+(Math.random()<.3?12:0);note(m,MT,1.2,'triangle',.05,2200)}MT+=.3;MI++}}
function startMusic(){if(MTimer)return;MTimer=setInterval(musicTick,150);musicTick()}

const LEGA=["....LLL..LLL....","....LLL..LLL....","....LLL..LLL....","...KKKK..KKKK..."];

function crewPx(c,x,y,L,f,st){const pal={...PXC,B:L.b,C:L.coat?'#e8f4ff':L.b,H:L.h=='helmet'?'#9fd8ff':(L.s=='prof'?'#eaeaf0':(L.hc||'#3a2a1a'))};
const rows=L.s=='prof'?PROF:STD,legs=Math.floor(st/Math.PI)%2?LEGB:LEGA;
c.save();c.translate(Math.round(x),Math.round(y));c.fillStyle='#0007';c.beginPath();c.ellipse(0,1,14,4,0,0,7);c.fill();c.scale(f,1);
const put=(R,oy)=>R.forEach((row,ry)=>{for(let rx=0;rx<row.length;rx++){const ch=row[rx];if(ch=='.')continue;c.fillStyle=pal[ch]||'#f0f';c.fillRect(-16+rx*2,-40+(ry+oy)*2,2,2)}});
put(rows,0);put(legs,16);
if(L.h=='antenna'){c.fillStyle='#cfe8ff';c.fillRect(0,-46,2,6);c.fillStyle='#ff4d4d';c.fillRect(0,-48,2,2)}
if(L.h=='crown'){c.fillStyle='#ffd84a';c.fillRect(-8,-44,16,4);c.fillRect(-8,-48,3,4);c.fillRect(-2,-50,4,6);c.fillRect(5,-48,3,4)}
if(L.h=='halo'){c.fillStyle='#ffd84a';c.fillRect(-10,-48,20,2)}
c.restore()}

function decorate(rooms,n){const out=[];rooms.forEach((r,ri)=>{let s=ri*97+n*13+7;const R=()=>{s=(s*9301+49297)%233280;return s/233280};const[,,x,y,w,h]=r;
out.push({k:'pipe',x:x+10,y:y+8,w:w-20,h:3});out.push({k:'pipe',x:x+10,y:y+15,w:w-20,h:2});
for(let i=0;i<3;i++)out.push({k:'lamp',x:x+w*(i+1)/4,y:y+14});
const kinds=n==1?['screen','crate','plant','console']:['orb','wave','node','screen'];const np=3+Math.floor(R()*3);
for(let i=0;i<np;i++){out.push({k:kinds[Math.floor(R()*4)],x:x+30+R()*(w-80),y:y+h*.45+R()*(h*.35),t:R()})}
if(r[0]=='fis'){for(let i=0;i<3;i++)out.push({k:'bench',x:x+30+i*75,y:y+h*.55});out.push({k:'tube',x:x+w-40,y:y+h*.6})}if(r[0]=='aula'){out.push({k:'board',x:x+w/2-60,y:y+30});for(let i=0;i<4;i++)out.push({k:'desk',x:x+30+i*55,y:y+h*.7})}if(r[0]=='bib'){for(let i=0;i<3;i++)out.push({k:'shelf',x:x+20+i*80,y:y+30})}out.push({k:'label',x:x+8,y:y+h-8,txt:r[1]});});return out}

case'node':c.fillStyle='#ff7a3c';c.beginPath();c.arc(x,y,5,0,7);c.fill();c.fillStyle='#3fe0ff';c.beginPath();c.arc(x+9,y+4,4,0,7);c.fill();c.beginPath();c.arc(x-7,y+5,4,0,7);c.fill();break;
case'bench':c.fillStyle='#4a3a5a';c.fillRect(x,y,50,8);for(let i=0;i<3;i++){c.fillStyle=['#8ff','#d04cff','#5dffb0'][i];c.fillRect(x+6+i*16,y-7,8,7)}break;

t3:{n:'Terminal de Energia',s:[nm('Se 1 mg (10⁻⁶ kg) de massa fosse totalmente convertido em energia, quantos ×10¹⁰ J seriam liberados? (c = 3×10⁸ m/s)',9,.05,'×10¹⁰ J','Use E = mc² com m em kg.','E = 10⁻⁶ × (3×10⁸)² = 9×10¹⁰ J. Modelo ideal.')],r:{cx:['mas'],cd:'meit'}},
t4:{n:'Terminal de Distâncias',s:[nm('Uma nave de 100 m de comprimento próprio passa por você a 0,6c. Quantos metros você mede?',80,.5,'m','Use L = L₀/γ. Para 0,6c, γ = 1,25.','γ = 1,25 e L = 100/1,25 = 80 m, só na direção do movimento.')],r:{cx:['con']}},
t5:{n:'Observatório (secreto)',s:[q('Vista de longe, o que ocorre com um relógio muito próximo ao horizonte de eventos de um buraco negro?',['Anda mais rápido','Anda mais devagar','Não muda','Para de funcionar para o próprio relógio'],1,'Gravidade forte curva o espaço-tempo e atrasa o tempo.','Correto. Visto de longe, o relógio avança mais devagar; para quem está nele, o tempo segue normal.')],r:{cx:['ger']}},
boss:{n:'Chefe: Escapar do buraco negro',s:[nm('A estação explode em 10 h (no relógio dela). Primeiro, calcule γ para 0,8c.',1.67,.02,'','γ = 1/√(1 − v²/c²).','γ = 1/0,6 ≈ 1,67.'),nm('Ida e volta a 0,8c duram 9 h no relógio da estação. Quantas horas passam a bordo?',5.4,.05,'h','O tempo a bordo é o tempo próprio: Δt₀ = Δt/γ.','Δt₀ = 9/1,67 = 5,4 h.'),q('Você volta antes da explosão?',['Sim: 9 h < 10 h, ambos no referencial da estação','Não: a bordo são 5,4 h, mas a estação precisa de 12 h','Sim, pois a bordo o tempo passa menos e a estação explode mais devagar','Impossível saber'],0,'Compare intervalos medidos no mesmo referencial.','Os 9 h e os 10 h pertencem ao relógio da estação. Você chega a tempo.')],r:{cx:[],cd:'dirac'}},
u1:{n:'Terminal de Quanta',s:[nm('Um fóton tem frequência de 5×10¹⁴ Hz. Qual sua energia, em eV? (h = 4,136×10⁻¹⁵ eV·s)',2.07,.03,'eV','Use E = hf.','E = 4,136×10⁻¹⁵ × 5×10¹⁴ ≈ 2,07 eV. A energia vem em pacotes de hf.'),q('Se a frequência de um quantum dobra, sua energia:',['Dobra','Fica igual','Cai pela metade','Não existe quantum'],0,'E é proporcional a f.','Correto: E = hf é diretamente proporcional à frequência.')],r:{cx:['qe'],cd:'planck'}},
u2:{n:'Terminal de Níveis',s:[nm('Um elétron do hidrogênio salta de n = 3 para n = 2. Qual a energia do fóton emitido, em eV? (Eₙ = −13,6/n² eV)',1.89,.02,'eV','Calcule E₃ e E₂ e subtraia.','E₃ = −1,51 eV e E₂ = −3,40 eV; ΔE = 1,89 eV.'),q('Um elétron absorve um fóton e passa para um nível maior. O que acontece?',['Emite um fóton de mesma energia','Ele absorve energia e vai para níveis mais altos','Sai do átomo sem energia','Não muda de nível'],1,'Absorção leva o elétron para cima; emissão, para baixo.','Correto. Absorção eleva o elétron a um nível maior; emissão o faz descer.')],r:{cx:['bohr'],cd:'bohr'}},
u3:{n:'Terminal de Incerteza',s:[nm('Um elétron tem posição conhecida com Δx = 1,0×10⁻¹⁰ m. Qual o menor Δp, em ×10⁻²⁵ kg·m/s? (ℏ = 1,055×10⁻³⁴ J·s)',5.28,.03,'×10⁻²⁵','Use Δp ≥ ℏ/(2Δx).','1,055×10⁻³⁴ / (2×10⁻¹⁰) ≈ 5,28×10⁻²⁵ kg·m/s.'),q('Se você mede a posição com precisão muito maior, a incerteza no momento:',['Diminui também','Aumenta','Fica zero','Não tem relação'],1,'Precisão em uma grandeza custa precisão na outra.','Correto. Δx e Δp são inversamente relacionados pelo princípio da incerteza.')],r:{cx:['heis'],cd:'heis'}},
u4:{n:'Terminal de Tunelamento',s:[q('Ao aumentar a largura de uma barreira, a probabilidade de tunelamento:',['Aumenta','Diminui','Fica igual','Fica zero para sempre'],1,'Pense no decaimento da função de onda dentro da barreira.','Correto. A transmissão cai exponencialmente com a largura da barreira.'),q('Por que o tunelamento acontece?',['A partícula ganha energia extra','A função de onda não se anula dentro da barreira, então há chance não nula de ser encontrada do outro lado','A barreira desaparece','A energia é criada'],1,'Pense em probabilidades, não em trajetórias.','Correto. O tunelamento é probabilístico, não uma passagem "por cima" da barreira.')],r:{cx:['tun']}},
u5:{n:'Observatório Quântico (secreto)',s:[q('Qual é a melhor interpretação de superposição?',['Partícula em dois lugares visíveis','Estado descrito por amplitudes; a medição dá um resultado com certa probabilidade','Partícula sem posição nem energia','Efeito térmico'],1,'Superposição é uma descrição, não um lugar.','Correto. Antes da medição, o estado é uma combinação de amplitudes; a medição dá um único resultado.')],r:{cx:['sup']}},
ub:{n:'Chefe: Estabilizar o núcleo',s:[nm('Um elétron tem P(estado 1) = 0,36 e P(estado 2) = 0,64. Qual a probabilidade (%) de medir o estado 1?',36,.5,'%','Probabilidades são |amplitude|²; a soma dá 1.','A probabilidade de medir o estado 1 é 0,36, ou 36%.'),q('Ao medir o sistema, ele:',['Permanece em superposição','Resulta em um único estado, com probabilidades dadas pelas amplitudes','Divide-se em dois sistemas visíveis','Desaparece'],1,'Uma medição produz um resultado.','Correto. A medição fornece um único resultado, com as probabilidades calculadas.'),q('Superposição significa que a partícula está fisicamente em dois lugares visíveis ao mesmo tempo?',['Sim, sempre','Não: o estado descreve amplitudes de probabilidade para os resultados da medição','Só na escala macroscópica','Depende do observador'],1,'Pense na interpretação por estados e probabilidades.','Correto. Superposição é uma descrição probabilística, não dois lugares visíveis.')],r:{cx:['sup'],cd:'schrod'}}};
const IT={t1:['Sensor de Referencial','Mostra velocidades relativas dos objetos da estação.'],t2:['Cronômetro Relativístico','Compara tempos próprios e dilatados.'],t3:['Célula de Energia','Armazena energia convertida de massa.'],t4:['Régua de Lorentz','Mede comprimentos em movimento.'],t5:['Carta Estelar','Dados do buraco negro, sinal do Observatório.'],boss:['Fragmento do Núcleo 1/5','Peça recuperada do núcleo de energia.'],u1:['Cristal de Quanta','Amostra que emite pulsos de energia discreta.'],u2:['Espectrômetro de Níveis','Registra as linhas do hidrogênio.'],u3:['Microscópio de Varredura','Mede posições com precisão e limita o momento.'],u4:['Membrana de Tunelamento','Permite atravessar barreiras de energia.'],u5:['Mapa de Probabilidades','Dados da nuvem eletrônica.'],ub:['Fragmento do Núcleo 2/5','Peça do núcleo, estabilizada pela superposição.']};

const NV=[['title','Menu'],['play','Explorar'],['tree','Árvore'],['labi','Lab. Científico'],['worlds','Mundos'],['mis','Missões'],['inv','Inventário'],['cdx','Codex'],['lab','Laboratório'],['cards','Cartas'],['ach','Conquistas'],['pause','Pausa']];
function go(n){cur=n;cm();$('nav').hidden=$('hud').hidden=n=='title';$('nav').innerHTML=NV.map(([k,l])=>`<button class="b s${k==n?' on':''}" onclick="go('${k}')">${l}</button>`).join('');hud();R[n]();$('scr').scrollTop=0}

const R={
title(){$('scr').innerHTML=`<div id="T"><div class="rg" style="width:260px;height:260px"></div><div class="rg" style="width:420px;height:420px;border-color:var(--cy);animation-direction:reverse"></div><h1 class="f">QUANTUM</h1><h2 class="f">Além dos Limites da Realidade</h2><p>Aprenda Física Moderna para sobreviver, explorar e reconstruir o núcleo de energia.</p><p><button class="b" onclick="newG()">Iniciar</button><button class="b" ${have()?'':'disabled'} onclick="S=ld();loadW(S.w||1);go('worlds')">Continuar</button><button class="b s" onclick="go('pause')">Configurações</button><button class="b s" onclick="md('<h3>Créditos</h3><p>Conceito, design e física: QUANTUM. Modelos didáticos e aproximações são indicados no Codex.</p><button class=b onclick=cm()>Fechar</button>')">Créditos</button></p></div>`},
worlds(){const W=[['Relatividade: a fronteira do espaço-tempo',1,true],['Mecânica quântica: o interior do átomo',2,!!S.done.boss],['Fóton: o poder da luz',3,false],['Núcleo: o poder da matéria',4,false],['Tecnologia: o futuro da física',5,false]];$('scr').innerHTML=`<h2>Seleção de mundos</h2><div class="g">${W.map(([w,i,open])=>{const done=i==1?S.done.boss:i==2?S.done.ub:0;return`<div class="c ${open?(done?'dn':''):'lk'}"><h3>Mundo ${i}</h3><p>${w}</p>${open?`<button class="b" onclick="S.w=${i};loadW(${i});save();go('play')">${done?'Rejogar':'Entrar'}</button>`:`<button class="b" disabled>${i==2?'Conclua o Mundo 1':'Bloqueado'}</button>`}</div>`}).join('')}</div><p>Fragmentos do núcleo: ${(S.done.boss?1:0)+(S.done.ub?1:0)}/5</p>`},
play(){if(TH!=(S.w||1))loadW(S.w||1);const m=WM;$('scr').innerHTML=`<h2 class="f" style="font-size:16px">${m.n}</h2><canvas id="cv" width="640" height="360" aria-label="Mapa da estação"></canvas><p class="hint">Computador: WASD ou setas para andar, E para interagir. Celular: arraste na tela para andar e toque em Interagir.</p><p id="ms" aria-live="polite">Explore. Siga as setas amarelas até as tarefas.</p><div style="text-align:center"><button class="b" onclick="act()">Interagir (E)</button></div>`;joy()},
mis(){const L=(arr)=>arr.map(([i,t,d])=>{const dn=i=='lab'?Object.keys(S.sims).length>=3:S.done[i],sc=/^(t5|u5)$/.test(i)&&!dn;return`<div class="c ${dn?'dn':sc?'q':''}"><h3>${sc?'Desafio secreto':t}</h3><p>${sc?'Explore o canto do cenário perto do buraco negro.':d}</p><b>${dn?'Concluída':i=='boss'||i=='ub'?'Chefe':'Ativa'}</b>${dn&&S.perf[i]?' · sem erros':''}</div>`}).join('');$('scr').innerHTML=`<h2>Missões · Mundo 1</h2><div class="g">${L(MS1)}</div>${S.done.boss?`<h2>Missões · Mundo 2</h2><div class="g">${L(MS2)}</div>`:'<p class="hint">Mundo 2 será liberado ao vencer o chefe do Mundo 1.</p>'}`},
inv(){const own=ITEMS.filter(i=>S.own.includes(i.id));$('scr').innerHTML=`<h2>Inventário</h2><h3>Equipamento e tripulantes: ${S.own.length}/${ITEMS.length}</h3><div class="g">${ITEMS.map(i=>{const o=S.own.includes(i.id),R_=RAR[i.r],eq=S.eq==i.id;return`<div class="c ${R_[2]} ${o?'':'lk'}"><h3><span class="sw" style="background:${i.b}"></span> ${i.n}</h3><p><b style="color:${R_[1]}">${R_[0]}</b></p><p>${o?i.d:'Bloqueado. '+(i.r=='r'?'Vença o chefe do Mundo 1.':i.r=='e'?'Vença o chefe do Mundo 2.':i.r=='l'?'Vença o chefe do Mundo 2 sem erros.':'Obtenha ao completar uma tarefa sem erros.')}</p>${o?`<button class="b" ${eq?'disabled':''} onclick="S.eq='${i.id}';save();R.inv()">${eq?'Equipado':'Equipar'}</button>`:''}</div>`}).join('')}</div><h3>Materiais e fragmentos</h3>${S.inv.length?`<div class="g">${S.inv.map(i=>`<div class="c"><h3>${i[0]}</h3><p>${i[1]}</p></div>`).join('')}</div>`:'<p>Vazio. Conclua desafios para obter materiais.</p>'}<h3>Cartas: ${Object.keys(S.cards).length}/10</h3>`},
cdx(){$('scr').innerHTML=`<h2>Codex Científico</h2>${Object.keys(CX).map(k=>{const c=CX[k];return S.cdx[k]?`<details class="c"><summary><b>${c[0]}</b></summary><p>${c[1]}</p><p class="eq">${c[2]}</p><p><b>Variáveis:</b> ${c[3]}<br><b>Unidade SI:</b> ${c[4]}<br><b>Exemplo:</b> ${c[5]}<br><b>Aplicação:</b> ${c[6]}<br><b>Cientistas:</b> ${c[7]}</p></details>`:`<div class="c lk">??? Conceito não descoberto</div>`}).join('')}`},
cards(){$('scr').innerHTML=`<h2>Cartas de cientistas</h2><div class="g">${Object.keys(CARDS).map(k=>{const c=CARDS[k],o=S.cards[k];return o?`<div class="c dn"><svg width="64" height="64" viewBox="0 0 64 64"><defs><linearGradient id="g${k}"><stop stop-color="#3fe0ff"/><stop offset="1" stop-color="#d04cff"/></linearGradient></defs><polygon points="32,3 60,18 60,46 32,61 4,46 4,18" fill="url(#g${k})" opacity=".8"/><text x="32" y="40" text-anchor="middle" font-size="22" fill="#001" font-family="Orbitron">${c[0].split(' ').map(w=>w[0]).slice(0,2).join('')}</text></svg><h3>${c[0]}</h3><small>${c[1]}</small><p>${c[2]}</p><p><b>Teoria:</b> ${c[3]}</p><p><b>Habilidade:</b> ${c[6]}</p><button class="b" ${S.used[k]?'disabled':''} onclick="useC('${k}')">${S.used[k]?'Usada':'Ativar (uso único)'}</button></div>`:`<div class="c lk"><h3>${c[0]}</h3><p>Carta bloqueada.</p></div>`}).join('')}</div>`},
ach(){$('scr').innerHTML=`<h2>Resultados e conquistas</h2><p>Conhecimento ${S.k} · Erros ${S.errs} · Tempo ${Math.round(S.t/60)} min · Fragmentos ${(S.done.boss?1:0)+(S.done.ub?1:0)}/5 · Itens ${S.own.length}/${ITEMS.length}</p><div class="g">${AL.map(([i,t])=>`<div class="c ${S.ach[i]?'dn':'lk'}">${S.ach[i]?'★ ':'☆ '}${t}</div>`).join('')}</div>`},
pause(){$('scr').innerHTML=`<h2>Pausa e configurações</h2><p>Música <input type="range" min="0" max="1" step=".05" value="${S.mus}" oninput="S.mus=+this.value;vol()"></p><p>Efeitos <input type="range" min="0" max="1" step=".05" value="${S.sfx}" oninput="S.sfx=+this.value"></p><button class="b" onclick="sv();toast('Progresso salvo.')">Salvar</button><button class="b s" onclick="go('title')">Voltar ao título</button><button class="b s" onclick="if(confirm('Apagar todo o progresso?')){try{localStorage.removeItem(KEY)}catch(e){}S=def();loadW(1);go('title')}">Apagar progresso</button><p id="ms"></p>`},
lab(){const t=[['dil','Dilatação temporal'],['fot','Efeito fotoelétrico'],['dec','Decaimento']];$('scr').innerHTML=`<h2>Laboratório experimental</h2>${t.map(x=>`<button class="b ${LT==x[0]?'on':''}" onclick="LT='${x[0]}';R.lab()">${x[1]}</button>`).join('')}<div class="c" id="sm"></div>`;SIM[LT]()}};

function sim(k){if(!S.sims[k]){S.sims[k]=1;if(k=='fot'){CD('fot');CA('planck')}if(k=='dec'){CD('dec');CA('curie')}if(Object.keys(S.sims).length>=3)gA('a2');save()}}
const CD=k=>{if(!S.cdx[k]){S.cdx[k]=1;S.k+=5}},CA=k=>{if(!S.cards[k]){S.cards[k]=1;S.k+=5;if(Object.keys(S.cards).length>=3)gA('a4')}};
const SIM={
dil(){$('sm').innerHTML=`<h3>Dilatação temporal (1 h a bordo)</h3><p>v = <b id="vv"></b> c<input type="range" id="v" min="0" max="99" value="${S.lv||60}"></p><p id="vo"></p><canvas id="lc" width="300" height="60"></canvas><p><small>Modelo: Δt = γΔt₀ com referenciais inerciais.</small></p>`;const f=()=>{const v=$('v').value/100,g=1/Math.sqrt(1-v*v);S.lv=$('v').value;$('vv').textContent=v.toFixed(2);$('vo').innerHTML=`γ = ${g.toFixed(3)}<br>Para a estação passam <b>${g.toFixed(2)} h</b>.`;const c=$('lc').getContext('2d');c.clearRect(0,0,300,60);c.fillStyle='#3fe0ff';c.fillRect(0,5,30,18);c.fillStyle='#d04cff';c.fillRect(0,35,Math.min(300,30*g),18);sim('dil')};$('v').oninput=f;f()},
fot(){$('sm').innerHTML=`<h3>Efeito fotoelétrico</h3><p>Material <select id="m"><option value="2.3">Sódio (φ≈2,3 eV)</option><option value="4.3">Zinco (φ≈4,3 eV)</option><option value="5.6">Platina (φ≈5,6 eV)</option></select></p><p>Frequência <b id="fv"></b> ×10¹⁴ Hz<input type="range" id="f" min="1" max="20" value="${S.lf||5}"></p><p>Intensidade <b id="iv"></b><input type="range" id="i" min="1" max="10" value="3"></p><canvas id="lc" width="300" height="100"></canvas><p id="fo"></p><p><small>Valores aproximados de φ. h = 4,136×10⁻¹⁵ eV·s.</small></p>`;const f=()=>{const p=+$('m').value,fr=+$('f').value,I=+$('i').value,E=4.136e-15*fr*1e14,K=Math.max(0,E-p),fc=p/4.136e-15/1e14;S.lf=fr;$('fv').textContent=fr;$('iv').textContent=I;const c=$('lc').getContext('2d');c.clearRect(0,0,300,100);c.fillStyle='#d04cff';c.fillRect(10,90-E*10,40,E*10);c.fillStyle='#ff7a3c';c.fillRect(0,90-p*10,60,2);if(K>0){c.fillStyle='#3fe0ff';for(let n=0;n<I;n++){c.beginPath();c.arc(90+n*18,80-K*8,5,0,7);c.fill()}}$('fo').innerHTML=`E = hf = ${E.toFixed(2)} eV · f de corte = ${fc.toFixed(1)}×10¹⁴ Hz<br>`+(K>0?`Kmáx = ${K.toFixed(2)} eV. ${I} elétrons ejetados (mais intensidade = mais elétrons, não mais energia cada).`:`Nenhum elétron: hf < φ. Aumentar a intensidade não resolve; aumente a frequência.`);sim('fot')};['m','f','i'].forEach(x=>$(x).oninput=f);f()},
dec(){$('sm').innerHTML=`<h3>Decaimento radioativo</h3><p>Meia-vida T = <b id="tv"></b> s<input type="range" id="T" min="1" max="10" value="4"></p><p>Tempo t = <b id="tt"></b> s<input type="range" id="t" min="0" max="40" value="0"></p><canvas id="lc" width="300" height="160"></canvas><p id="do"></p><p><small>Modelo estatístico: núcleos individuais decaem ao acaso.</small></p>`;const f=()=>{const T=+$('T').value,t=+$('t').value,n=Math.round(256*Math.pow(.5,t/T));$('tv').textContent=T;$('tt').textContent=t;const c=$('lc').getContext('2d');c.clearRect(0,0,300,160);for(let i=0;i<256;i++){c.fillStyle=i<n?'#ff7a3c':'#1d3a6b';c.fillRect(6+(i%32)*9,6+Math.floor(i/32)*9,6,6)}$('do').textContent=`t/T = ${(t/T).toFixed(1)} → restam ${n} de 256 núcleos (${(100*n/256).toFixed(1)}%).`;sim('dec')};$('T').oninput=$('t').oninput=f;f()}};

einstein_rel:{t:'Sobre a eletrodinâmica dos corpos em movimento',a:'Albert Einstein, 1905',k:'post',p:['Contexto: no início do século XX, as leis do eletromagnetismo pareciam depender do referencial, como se houvesse um meio privilegiado, o éter.','Einstein partiu de dois princípios: as leis da física são as mesmas em todos os referenciais inerciais, e a luz no vácuo tem a mesma velocidade c para todos eles.','Dessas premissas seguem a relatividade do tempo e a do comprimento. Um relógio em movimento marca intervalos maiores para quem está em repouso: Δt = γ·Δt₀.']},
